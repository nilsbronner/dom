<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1f14" />
  <title>Jardin Urbain — Visite virtuelle 3D</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="loader">
    <div class="loader-inner">
      <div class="leaf">
        <svg viewBox="0 0 24 24" width="48" height="48"><path fill="#9fbf5b" d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3C9 21.5 16 21 19 12c1-3 0-5-2-4M5 6c2-1 4-1 6 0 3 1 5 5 6 8 1-4-1-7-3-9C12 4 7 3 5 6"/></svg>
      </div>
      <div class="loader-text">Préparation du jardin…</div>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Jardin Urbain</span>
    </div>
    <nav class="top-actions">
      <button class="mode-btn active" data-mode="orbit" title="Vue libre">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8m-1-13h2v6h-2zm0 7h2v2h-2z"/></svg>
      </button>
      <button class="mode-btn" data-mode="aerial" title="Vue aérienne">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <button class="mode-btn" data-mode="human" title="Vue humaine">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4a2 2 0 1 1-2 2 2 2 0 0 1 2-2m0 5a8 8 0 0 1 7 4l-2 1-2-3v9h-2v-6h-2v6h-2v-9l-2 3-2-1a8 8 0 0 1 7-4"/></svg>
      </button>
      <button class="mode-btn" id="audio-toggle" title="Son ambiant">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4"/></svg>
      </button>
    </nav>
  </header>

  <aside id="zones-panel">
    <div class="zones-title">Zones du jardin</div>
    <ul class="zones-list">
      <li data-zone="terrasse"><span class="z-num">1</span><span class="z-name">Terrasse centrale</span></li>
      <li data-zone="miombre"><span class="z-num">2</span><span class="z-name">Mi-ombre</span></li>
      <li data-zone="potager"><span class="z-num">3</span><span class="z-name">Potager &amp; herbes</span></li>
      <li data-zone="bbq"><span class="z-num">4</span><span class="z-name">Barbecue</span></li>
      <li data-zone="atelier"><span class="z-num">5</span><span class="z-name">Atelier / stockage</span></li>
      <li data-zone="jacuzzi"><span class="z-num">6</span><span class="z-name">Jacuzzi spa</span></li>
    </ul>
  </aside>

  <div id="hint">
    <div class="hint-row"><kbd>clic-gauche</kbd> orbiter</div>
    <div class="hint-row"><kbd>clic-droit</kbd> déplacer</div>
    <div class="hint-row"><kbd>molette</kbd> zoomer</div>
  </div>

  <div id="zone-info">
    <div class="zi-eyebrow">Zone</div>
    <div class="zi-title"></div>
    <div class="zi-desc"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
